name: kedrovnik

services:
  postgres:
    # PostGIS: built houses carry geographic points (map, distance queries).
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - '127.0.0.1:46132:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.31.3
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
    ports:
      - '127.0.0.1:46125:1025'
      - '127.0.0.1:46180:8025'

  # CRM mock in the Bitrix24 REST dialect (tools/crm-mock): the `bitrix24` lead sink talks to it
  # locally; its page on http://localhost:46140 lists the leads it received.
  crm-mock:
    image: node:24-alpine
    restart: unless-stopped
    command: ['node', '/app/server.mjs']
    environment:
      CRM_MOCK_TOKEN: ${CRM_MOCK_TOKEN:?set CRM_MOCK_TOKEN in .env}
      CRM_MOCK_STORE: /data/leads.json
      PORT: '8080'
    ports:
      - '127.0.0.1:46140:8080'
    volumes:
      - ./tools/crm-mock/server.mjs:/app/server.mjs:ro
      - crm-mock-data:/data
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:8080/health']
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
  crm-mock-data:

# The host's default address pools are exhausted, so the project network gets an explicit,
# otherwise unused subnet.
networks:
  default:
    ipam:
      config:
        - subnet: 10.239.146.0/27
