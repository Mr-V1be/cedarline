<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Fonts for images the server draws (the schemes of the articles): the site's own Manrope from
  this folder first, then whatever the system has. Containers have no system fonts at all, so
  without this file text in the schemes would not render; with it, every machine draws the
  same pixels.
-->
<fontconfig>
  <dir prefix="relative">.</dir>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <cachedir prefix="xdg">fontconfig</cachedir>
</fontconfig>
