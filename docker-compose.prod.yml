# Production stack: PostgreSQL, a one-off migration, the site and Caddy with automatic TLS,
# plus nightly backups. Settings and secrets live in `.env.production` (template:
# `.env.production.example`), passed with `--env-file .env.production`; each service gets only
# the variables it needs. docs/deploy.md walks through a first deployment.
name: kedrovnik

x-logging: &logging # Container logs rotate: at most 5 files of 10 MB per service.
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-app-env: &app-env
  env_file: ${APP_ENV_FILE:-.env.production}
  environment:
    # Scheduled jobs (demo reset, mailbox cleanup) run on the server's local time.
    TZ: ${TZ:-Europe/Moscow}

services:
  postgres:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  # Schema migrations before every start of the site; exits when the database is current. The
  # same image runs the seed and the demo reset by hand (docs/deploy.md).
  migrate:
    image: ${KEDROVNIK_TOOLS_IMAGE:-kedrovnik-tools:latest}
    build:
      context: .
      target: tools
    <<: *app-env
    command: ['migrate']
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    # The same volumes as the site: `run src/seed/run.ts` uploads the demo renders there.
    volumes:
      - media:/app/apps/web/media
      - documents:/app/apps/web/documents
      - mailbox-files:/app/apps/web/mailbox-files
    logging: *logging

  web:
    image: ${KEDROVNIK_WEB_IMAGE:-kedrovnik-web:latest}
    build:
      context: .
      target: runner
    <<: *app-env
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - media:/app/apps/web/media
      - documents:/app/apps/web/documents
      - mailbox-files:/app/apps/web/mailbox-files
    logging: *logging

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL}
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    logging: *logging

  # Nightly dump of the database and an archive of uploads and proposals, kept for N days.
  backup:
    image: postgis/postgis:18-3.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-03:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      TZ: ${TZ:-Europe/Moscow}
    entrypoint: ['/bin/sh', '/backup/backup.sh']
    volumes:
      - ./deploy/backup.sh:/backup/backup.sh:ro
      - media:/data/media:ro
      - documents:/data/documents:ro
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    logging: *logging

  # Demo stands only (`--profile demo`): the CRM mock that the bitrix24 lead sink talks to.
  crm-mock:
    profiles: ['demo']
    image: node:24-alpine
    restart: unless-stopped
    command: ['node', '/app/server.mjs']
    environment:
      CRM_MOCK_TOKEN: ${CRM_MOCK_TOKEN:-}
      CRM_MOCK_STORE: /data/leads.json
      PORT: '8080'
    volumes:
      - ./tools/crm-mock/server.mjs:/app/server.mjs:ro
      - crm-mock-data:/data
    logging: *logging

volumes:
  postgres-data:
  media:
  documents:
  mailbox-files:
  backups:
  caddy-data:
  caddy-config:
  crm-mock-data:
