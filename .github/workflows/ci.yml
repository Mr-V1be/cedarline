name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Gates, typecheck, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Code shape (file and folder size limits)
        run: pnpm gate:shape
      - run: pnpm typecheck
      - name: Lint
        run: pnpm lint
        env:
          # Typed linting of the whole workspace needs more than the runner's default heap.
          NODE_OPTIONS: --max-old-space-size=3072
      - run: pnpm format:check
      - run: pnpm test

  build:
    name: Migrations and production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: kedrovnik
          POSTGRES_USER: kedrovnik
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kedrovnik -d kedrovnik"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://kedrovnik:ci-only-password@localhost:5432/kedrovnik
      PAYLOAD_SECRET: ci-only-secret-that-is-at-least-32-characters
      SITE_URL: http://localhost:46100
      # No mail is sent in CI; the transport only has to be configured.
      SMTP_HOST: localhost
      SMTP_PORT: '1025'
      MAIL_FROM_ADDRESS: ci@kedrovnik.example
      MAIL_FROM_NAME: Kedrovnik CI
      LEAD_SINKS: cms
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to an empty database
        run: pnpm --filter @kedrovnik/web migrate
      - name: Seed demo content
        run: pnpm --filter @kedrovnik/web seed
      - run: pnpm build

  images:
    name: Container images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: checks
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: kedrovnik
          POSTGRES_USER: kedrovnik
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kedrovnik -d kedrovnik"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - run: docker build --target runner -t kedrovnik-web:ci .
      - run: docker build --target tools -t kedrovnik-tools:ci .
      - name: Migrations from the tools image, then the server image answers its healthcheck
        run: |
          cat > ci.env <<'ENV'
          DATABASE_URL=postgres://kedrovnik:ci-only-password@127.0.0.1:5432/kedrovnik
          PAYLOAD_SECRET=ci-only-secret-that-is-at-least-32-characters
          SITE_URL=http://localhost:3000
          MAIL_FROM_ADDRESS=ci@kedrovnik.example
          MAIL_FROM_NAME=Kedrovnik CI
          ENV
          docker run --rm --network host --env-file ci.env kedrovnik-tools:ci migrate
          docker run -d --name web --network host --env-file ci.env kedrovnik-web:ci
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:3000/api/health && exit 0
            sleep 2
          done
          docker logs web
          exit 1
